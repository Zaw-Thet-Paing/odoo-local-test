name: odoo-local

x-odoo-image: &odoo-image
  build:
    context: .
    dockerfile: Dockerfile
  image: odoo-local:18.0

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-odoo}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data/pgdata
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-odoo} -d ${POSTGRES_DB:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - odoo-network

  odoo-init:
    <<: *odoo-image
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    command:
      - odoo
      - --database=${ODOO_DB:-odoo-local}
      - --init=pos_staff_security
      - --stop-after-init
      - --without-demo=all
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      - odoo-network

  odoo:
    <<: *odoo-image
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    ports:
      - "${ODOO_PORT:-8069}:8069"
    environment:
      HOST: db
      PORT: 5432
      USER: ${POSTGRES_USER:-odoo}
      PASSWORD: ${POSTGRES_PASSWORD:-odoo}
    command: ["odoo", "--database=${ODOO_DB:-odoo-local}"]
    volumes:
      - odoo-data:/var/lib/odoo
    networks:
      - odoo-network

  adminer:
    image: adminer:4
    profiles: ["dev"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - odoo-network

volumes:
  postgres-data:
  odoo-data:

networks:
  odoo-network:
    driver: bridge
